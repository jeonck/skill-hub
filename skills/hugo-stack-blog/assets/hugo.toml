baseURL = "{{BASE_URL}}"
locale = "ko-kr"
title = "{{TITLE}}"
defaultContentLanguage = "ko"
hasCJKLanguage = false
enableRobotsTXT = true
enableEmoji = true

[[module.imports]]
    path = "github.com/CaiJimmy/hugo-theme-stack/v4"

[pagination]
    pagerSize = 5

[permalinks]
    post = "/p/:slug/"
    page = "/:slug/"

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
        [markup.goldmark.extensions]
            [markup.goldmark.extensions.passthrough]
                enable = true
                [markup.goldmark.extensions.passthrough.delimiters]
                    block  = [["\\[", "\\]"], ["$$", "$$"]]
                    inline = [["\\(", "\\)"]]
    [markup.tableOfContents]
        endLevel   = 4
        ordered    = true
        startLevel = 2
    [markup.highlight]
        noClasses          = false
        codeFences         = true
        guessSyntax        = true
        lineNoStart        = 1
        lineNos            = true
        lineNumbersInTable = true
        tabWidth           = 4

[params]
    mainSections = ["post"]
    rssFullContent = true

    [params.footer]
        since = {{YEAR}}
        customText = ""

    [params.dateFormat]
        published = "January 2, 2006"
        lastUpdated = "January 2, 2006"

    [params.sidebar]
        subtitle = "{{SUBTITLE}}"

    [params.article]
        math = false
        toc = true
        readingTime = true

    [params.colorScheme]
        toggle = true
        default = "auto"

    [params.widgets]
        [[params.widgets.page]]
            type = "archives"
        [[params.widgets.page]]
            type = "tag-cloud"

[languages]
    [languages.ko]
        label = "Korean"
        title = "{{TITLE}}"
        weight = 1
        [languages.ko.params]
            [languages.ko.params.sidebar]
                subtitle = "{{SUBTITLE}}"
        [[languages.ko.menu.main]]
            identifier = "home"
            name = "Home"
            url = "/"
            weight = 1
        [[languages.ko.menu.main]]
            identifier = "about"
            name = "About"
            url = "/about"
            weight = 2
        [[languages.ko.menu.main]]
            identifier = "search"
            name = "Search"
            url = "/search"
            weight = 3
        [[languages.ko.menu.main]]
            identifier = "archives"
            name = "Archives"
            url = "/archives"
            weight = 4

[services.disqus]
    shortname = ""

[services.googleAnalytics]
    id = ""
