name: Build and deploy Skill Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site and per-skill zips
        run: python3 tools/build.py

      # build.py also regenerates assets/icons/ and the README table. A diff here
      # means someone changed a skill without rerunning it -- the site is still
      # correct, so warn rather than block the deploy.
      - name: Check generated README icons are current
        run: |
          if ! git diff --quiet -- README.md assets/icons; then
            echo "::warning::README icon table or assets/icons is stale. Run 'python3 tools/build.py' and commit the result."
            git diff --stat -- README.md assets/icons
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
